<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Student Account | The Kiran Academy (TKA)</title>
  <meta name="description" content="Register for a new student account at The Kiran Academy to access Java, Python, DSA courses, and mock test series.">
  
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <!-- Header Navigation -->
  <header class="header-navbar">
    <div class="container nav-container">
      <a href="index.html" class="brand-logo">
        <div class="logo-icon-box">TKA</div>
        <div class="logo-text">The Kiran <span>Academy</span></div>
      </a>

      <nav class="nav-menu">
        <a href="index.html" class="nav-link">Home</a>
        <a href="courses.html" class="nav-link">Courses</a>
        <a href="internships.html" class="nav-link">Internships</a>
        <a href="placements.html" class="nav-link">Placements</a>
        <a href="mock-tests.html" class="nav-link">Mock Tests</a>
      </nav>

      <div class="nav-actions">
        <button class="theme-toggle-btn" aria-label="Toggle Theme">
          <i class="fa-solid fa-moon"></i>
        </button>
      </div>
    </div>
  </header>

  <!-- Register Main Container -->
  <div class="auth-page-wrapper">
    <div class="auth-card" style="max-width: 520px;">
      <div class="auth-header">
        <div class="logo-icon-box" style="margin: 0 auto 1rem auto; width: 52px; height: 52px; font-size: 1.5rem;">TKA</div>
        <h1 class="auth-title">Create Student Account</h1>
        <p style="color: var(--text-muted); font-size: 0.9rem;">Join thousands of students building successful IT careers</p>
      </div>

      <form id="tkaRegisterForm">
        <div class="form-group">
          <label class="form-label">Full Name *</label>
          <input type="text" id="regName" class="form-control" required placeholder="e.g. Saurabh Kulkarni">
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
          <div class="form-group">
            <label class="form-label">Email Address *</label>
            <input type="email" id="regEmail" class="form-control" required placeholder="name@domain.com">
          </div>

          <div class="form-group">
            <label class="form-label">Phone Number *</label>
            <input type="tel" id="regPhone" class="form-control" required placeholder="+91 98765 43210">
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Password *</label>
          <div class="password-input-wrap">
            <input type="password" id="regPassword" class="form-control" required placeholder="At least 6 characters">
            <button type="button" class="password-toggle-btn" onclick="togglePasswordVisibility('regPassword', this)">
              <i class="fa-solid fa-eye"></i>
            </button>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Confirm Password *</label>
          <div class="password-input-wrap">
            <input type="password" id="regConfirmPassword" class="form-control" required placeholder="Re-enter password">
            <button type="button" class="password-toggle-btn" onclick="togglePasswordVisibility('regConfirmPassword', this)">
              <i class="fa-solid fa-eye"></i>
            </button>
          </div>
        </div>

        <div style="margin-bottom: 1.5rem; font-size: 0.85rem; color: var(--text-muted);">
          By signing up, you agree to TKA's Terms of Service and Privacy Policy. Demo registration is stored locally.
        </div>

        <button type="submit" class="btn btn-primary btn-block btn-lg">
          Create Account <i class="fa-solid fa-user-plus"></i>
        </button>
      </form>

      <div style="text-align: center; margin-top: 1.75rem; font-size: 0.9rem; color: var(--text-muted);">
        Already have an account? <a href="login.html" style="font-weight: 700;">Sign In</a>
      </div>
    </div>
  </div>

  <script src="js/main.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
